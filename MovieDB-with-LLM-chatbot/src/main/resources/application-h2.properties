# In-memory H2 database (no install needed) with the same tables as PostgreSQL, filled with 38 sample movies.
# Activate with:  --spring.profiles.active=h2   (Eclipse: Run Configurations > Arguments)
spring.datasource.url=jdbc:h2:mem:moviedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/seed.sql
spring.sql.init.encoding=UTF-8
# Browse tables at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:moviedb, user: sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
