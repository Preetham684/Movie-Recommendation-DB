<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieBot · CSE 412</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="8" width="26" height="19" rx="3"/>
      <path d="M3 13h26M9 8l3 5M16 8l3 5M23 8l3 5"/>
    </svg>
    <div>
      <h1>MovieBot</h1>
      <p>Ask about movies in plain English</p>
    </div>
  </div>
  <div class="status">
    <span class="badge powered">
      <span class="dot"></span>Powered by
      <b th:text="${#strings.replace(#strings.replace(llmLabel, ' (', ' · '), ')', '')}">Azure OpenAI · gpt-4.1-mini</b>
    </span>
    <span class="badge">
      <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>
      <b th:text="${dbLabel}">PostgreSQL</b>
    </span>
    <button id="reset" class="btn-ghost" type="button">New chat</button>
  </div>
</header>

<main id="chat" class="chat">
  <section class="welcome" id="welcome">
    <h2>Hi! What would you like to know?</h2>
    <p>I look up every answer in our movie database, so nothing is made up. Try one of these:</p>
    <div class="examples">
      <button class="ex" type="button">Tell me about Guardians of the Galaxy</button>
      <button class="ex" type="button">How is Split rated?</button>
      <button class="ex" type="button">Recommend a sci-fi movie</button>
      <button class="ex" type="button">Which movies did Ridley Scott direct?</button>
      <button class="ex" type="button">Which movies have Chris Pratt?</button>
      <button class="ex" type="button">I liked Prometheus, what should I watch next?</button>
    </div>
  </section>
</main>

<footer class="composer-wrap">
  <form id="form" class="composer" autocomplete="off">
    <input id="input" placeholder="Ask MovieBot about a movie, actor, genre or rating…" aria-label="Message" autofocus>
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </form>
  <div class="hint">
    <label class="switch"><input type="checkbox" id="showSteps" checked><span></span> Show agent steps</label>
    <span class="credit">CSE 412 · Group 24 · LLM agent → tools → SQL → database</span>
  </div>
</footer>
<script src="/app.js"></script>
</body>
</html>
