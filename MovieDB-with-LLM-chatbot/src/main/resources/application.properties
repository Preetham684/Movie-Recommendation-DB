spring.application.name=movie-agent
server.port=8080

# ---------- Database: PostgreSQL (default) ----------
# Each teammate sets their own values as environment variables (never commit passwords):
#   setx PGPASSWORD "your-postgres-password"
#   setx DB_URL  "jdbc:postgresql://localhost:5432/MovieDB"   (only if yours differs)
#   setx DB_USER "postgres"                                    (only if yours differs)
# For the in-memory H2 database instead, run with:  --spring.profiles.active=h2
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/MovieDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# Never run schema.sql / seed.sql against the real database - tables and data are used as-is.
spring.sql.init.mode=never
spring.h2.console.enabled=false

# ---------- LLM: "azure" (cloud) or "ollama" (free, local) ----------
llm.provider=azure

# Azure OpenAI. Put the key in an environment variable, NOT in this file:
#   setx AZURE_OPENAI_API_KEY "your-key"
azure.endpoint=https://movie4483-resource.openai.azure.com
azure.deployment=gpt-4.1-mini
azure.apiVersion=2024-10-21
azure.apiKey=

# Ollama: install from https://ollama.com then run:  ollama pull qwen2.5:7b
ollama.url=http://localhost:11434/v1/chat/completions
ollama.model=qwen2.5:7b

# ---------- Logging ----------
# DEBUG = every user question, tool call, SQL query + params, row count, LLM reply, errors. Use INFO for quieter logs.
logging.level.edu.asu.cse412=DEBUG
#logging.level.org.postgresql=DEBUG
logging.file.name=logs/moviebot.log

spring.thymeleaf.cache=false
